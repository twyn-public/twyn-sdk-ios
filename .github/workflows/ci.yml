name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds the sample app, which resolves the private TwynIOSSDK pod + the two
  # Rust cores from the private repos and compiles the whole SDK. This is the
  # supported integration path (SwiftPM's binaryTarget cannot authenticate to a
  # private release).
  build-sample:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Authenticate git to the private repos (twyn-ios-sdk + twyn-sdk-dist).
      # Secret TWYN_SDK_DIST_TOKEN: a GitHub token with read access to them.
      - name: Configure git credentials for the private repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.TWYN_SDK_DIST_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: pod install (resolves the private SDK)
        working-directory: SampleApp
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      - name: Build the sample (iOS Simulator)
        working-directory: SampleApp
        run: |
          xcodebuild -workspace TwynSampleApp.xcworkspace -scheme TwynSampleApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
