# XcodeGen spec — run `xcodegen generate` in SampleApp/ to (re)create
# TwynSampleApp.xcodeproj. The project links the Twyn SDK via CocoaPods
# (see Podfile), so the build entry point is TwynSampleApp.xcworkspace.
name: TwynSampleApp
options:
  bundleIdPrefix: me.twyn
  deploymentTarget:
    iOS: "15.6"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  TwynSampleApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        # Must match an allowed package on the Twyn gateway.
        PRODUCT_BUNDLE_IDENTIFIER: com.t4isb.ibeta
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Face capture for liveness enrollment."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Saves the enrollment capture."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Device integrity signal."
        INFOPLIST_KEY_NSMotionUsageDescription: "Device integrity signal."
        TARGETED_DEVICE_FAMILY: "1,2"
